    // Map user stream input to question bank key
    function getStreamKey(stream) {
        const s = (stream || '').toLowerCase();
        if (s.includes('cs') || s.includes('computer') || s.includes('engineer') || s.includes('it') || s.includes('software') || s.includes('tech')) return 'cs';
        if (s.includes('commerce') || s.includes('business') || s.includes('finance') || s.includes('account') || s.includes('mba') || s.includes('economics') || s.includes('bcom')) return 'commerce';
        return '_default';
    }

    function getDifficulty(userRecords) {
        if (userRecords.length === 0) return 'medium'; // first test

        if (lastScore >= 40) return 'medium';
        return 'easy';
    }

    // Auth UI helpers
    function updateUserUI(user) {
        const display = document.getElementById('header-user-display');
        const authBtn = document.getElementById('btn-header-auth');
        const logoutBtn = document.getElementById('btn-logout');
        if (user && user.email) {
            display.classList.remove('hidden');
            document.getElementById('header-user-name').textContent = user.name;
            document.getElementById('header-user-role').textContent = user.role || 'Member';
            document.getElementById('header-user-avatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
            authBtn.classList.add('hidden');
            logoutBtn.classList.remove('hidden');
        } else {
            display.classList.add('hidden');
            authBtn.classList.remove('hidden');
            logoutBtn.classList.add('hidden');
        }
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-pass').value;
        const submitBtn = document.getElementById('btn-login-submit');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await resp.json();
            if (!resp.ok) {
                showAuthAlert(data.error || 'Failed to login');
            } else {
                userData = data.user;
                localStorage.setItem('skillswap_user', JSON.stringify(userData));
                localStorage.setItem('skillswap_email', userData.email);
                updateUserUI(userData);
                await loadUserAssessments(userData.email);
                showView('dashboard');
            }
        } catch (err) {
            console.warn('Backend unavailable, using local session', err);
            userData = { name: email.split('@')[0], email, role: 'Student', stream: 'CS', spec: 'General' };
            localStorage.setItem('skillswap_user', JSON.stringify(userData));
            localStorage.setItem('skillswap_email', userData.email);
            updateUserUI(userData);
            showView('dashboard');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });

        activeQuestions = [...(bank[currentDifficulty] || bank.medium)];

        // Show difficulty badge
        document.getElementById('difficulty-badge').textContent = `Difficulty: ${currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1)} | Stream: ${userData.stream}`;

        showView('assessment');
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        renderQuestion();
    }

    function updateTimer() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = String(Math.floor(elapsed/60)).padStart(2,'0') + ':' + String(elapsed%60).padStart(2,'0');
    }

    function renderQuestion() {
        const q = activeQuestions[currentQ];
        document.getElementById('q-current').textContent = currentQ + 1;
        document.getElementById('q-domain').textContent = q.domain.replace(/_/g,' ');
        document.getElementById('progress-bar').style.width = ((currentQ+1)*10)+'%';
        document.getElementById('q-text').textContent = q.text;
        const optCont = document.getElementById('q-options');
        optCont.innerHTML = '';
        selectedAnswer = -1;
        document.getElementById('btn-next').disabled = true;
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option-btn w-full text-left px-5 py-3.5 rounded-xl border border-slate-700 transition';
            btn.textContent = opt;
            btn.addEventListener('click', () => { selectedAnswer = i; document.getElementById('btn-next').disabled = false; document.querySelectorAll('.option-btn').forEach((b,idx) => b.classList.toggle('selected', idx===i)); });
            optCont.appendChild(btn);
        });
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        if (selectedAnswer === activeQuestions[currentQ].answer) scores[activeQuestions[currentQ].domain]++;
        currentQ++;
        if (currentQ >= activeQuestions.length) { clearInterval(timerInterval); finishAssessment(); }
        else renderQuestion();
    });

    function finishAssessment() {
        const totalTime = (Date.now() - startTime) / 1000;
        const total = Object.values(scores).reduce((a,b)=>a+b,0);
        const maxTotal = Object.values(maxScores).reduce((a,b)=>a+b,0);
        const overall = Math.round((total/maxTotal)*100);
        const confidence = Math.min(100, Math.round(Math.max(20, 100 - totalTime/2 + overall*0.3)));
        const level = overall >= 80 ? 'Expert' : overall >= 60 ? 'Advanced' : overall >= 40 ? 'Intermediate' : 'Beginner';
        const gaps = [];
        Object.entries(scores).forEach(([k,v]) => { if ((v/maxScores[k])*100 < 60) gaps.push(k.replace(/_/g,' ')); });

        lastResult = { overall, confidence, level, gaps };
        showResults(overall, confidence, level, gaps);
        saveResult(overall, confidence, level, gaps);
    }

    function showResults(overall, confidence, level, gaps) {
        showView('results');
        document.getElementById('overall-score').textContent = overall;
        document.getElementById('score-ring').style.setProperty('--score', overall);
        document.getElementById('predicted-level').textContent = level;

        const radarCtx = document.getElementById('radar-chart').getContext('2d');
        if (window._radarChart) window._radarChart.destroy();
        window._radarChart = new Chart(radarCtx, { type:'radar', data:{ labels:['Analytical','Problem Solving','Decision Making','Attention','Knowledge'], datasets:[{ label:'Score %', data:Object.keys(scores).map(k=>Math.round((scores[k]/maxScores[k])*100)), backgroundColor:'rgba(99,102,241,0.2)', borderColor:'#6366f1', pointBackgroundColor:'#6366f1' }] }, options:{ scales:{ r:{ beginAtZero:true, max:100, grid:{color:'rgba(148,163,184,0.1)'}, ticks:{display:false}, pointLabels:{color:'#94a3b8',font:{size:11}} } }, plugins:{legend:{display:false}} } });

        const barCtx = document.getElementById('bar-chart').getContext('2d');
        if (window._barChart) window._barChart.destroy();
        window._barChart = new Chart(barCtx, { type:'bar', data:{ labels:['Analytical','Problem Solving','Decision','Attention','Knowledge'], datasets:[{ data:Object.keys(scores).map(k=>Math.round((scores[k]/maxScores[k])*100)), backgroundColor:['#6366f1','#8b5cf6','#a78bfa','#c4b5fd','#818cf8'] }] }, options:{ indexAxis:'y', scales:{ x:{max:100,grid:{color:'rgba(148,163,184,0.1)'},ticks:{color:'#94a3b8'}}, y:{grid:{display:false},ticks:{color:'#94a3b8'}} }, plugins:{legend:{display:false}} } });

        const gapsCont = document.getElementById('skill-gaps');
        gapsCont.innerHTML = gaps.length ? gaps.map(g=>`<div class="flex items-center gap-2 text-amber-400"><i data-lucide="alert-triangle" style="width:16px;height:16px"></i><span class="capitalize">${g}</span></div>`).join('') : '<p class="text-emerald-400">No significant gaps detected!</p>';
        const recsCont = document.getElementById('recommendations');
        const recs = gaps.length ? gaps.map(g=>`Practice more ${g} exercises`) : ['Keep challenging yourself with advanced problems'];
        recsCont.innerHTML = recs.map(r=>`<div class="flex items-center gap-2 text-slate-300"><i data-lucide="lightbulb" style="width:16px;height:16px;color:#fbbf24"></i><span>${r}</span></div>`).join('');
        lucide.createIcons();
    }

    async function saveResult(overall, confidence, level, gaps) {
        const record = {
            user_name: userData.name || 'Anonymous',
            user_email: userData.email || 'guest@skillswap.ai',
            user_role: userData.role || 'Student',
            stream: userData.stream || 'CS',
            specialization: userData.spec || 'General',
            predicted_level: level,
            confidence,
            overall_score: overall,
            analytical_reasoning: Math.round((scores.analytical_reasoning/maxScores.analytical_reasoning)*100),
            problem_solving: Math.round((scores.problem_solving/maxScores.problem_solving)*100),
            decision_making: Math.round((scores.decision_making/maxScores.decision_making)*100),
            attention_consistency: Math.round((scores.attention_consistency/maxScores.attention_consistency)*100),
            knowledge_recall: Math.round((scores.knowledge_recall/maxScores.knowledge_recall)*100),
            skill_gaps: gaps.join(', ') || 'None',
            assessment_date: new Date().toISOString(),
            difficulty_level: currentDifficulty
        };

        try {
            const resp = await fetch('/api/assessments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            });
            if (resp.ok) {
                const data = await resp.json();
                record.streaks = data.streaks || 1;
            }
        } catch (err) {
            console.warn('Backend unavailable, saving locally', err);
        }

        allRecords.push(record);
        if (window.dataSdk && window.dataSdk.create) {
            try { await window.dataSdk.create(record); } catch(e) {}
        }
        renderHistory();
    }

    // Dashboard
    function renderDashboard() {
        const userRecs = allRecords.filter(r => r.user_email === userData.email);
        document.getElementById('stat-streak').textContent = userRecs.length;
        document.getElementById('stat-taught').textContent = '3';
        document.getElementById('stat-taken').textContent = '7';
        document.getElementById('stat-tscore').textContent = '4.6';

        const upcoming = document.getElementById('dash-upcoming');
        upcoming.innerHTML = dummyClasses.slice(0,3).map(c => `
            <div class="glass rounded-xl p-4 flex items-center justify-between">
                <div><p class="font-medium">${c.title}</p><p class="text-sm text-slate-400">${c.teacher} · ${c.time}</p></div>
                <a href="${c.zoom}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-medium transition">Join Zoom</a>
            </div>
        `).join('');

        const recent = document.getElementById('dash-recent');
        const last = userRecs[userRecs.length - 1];
        if (last) {
            recent.innerHTML = `<div class="flex items-center justify-between"><div><p class="font-semibold">${last.user_name}</p><p class="text-sm text-slate-400">${last.stream} · ${last.specialization} · ${last.difficulty_level || 'medium'} difficulty</p></div><div class="flex items-center gap-3"><span class="mono text-2xl font-bold text-indigo-400">${last.overall_score}%</span><span class="px-2 py-1 rounded-full text-xs font-medium ${last.predicted_level==='Expert'?'bg-emerald-500/20 text-emerald-400':last.predicted_level==='Advanced'?'bg-blue-500/20 text-blue-400':'bg-amber-500/20 text-amber-400'}">${last.predicted_level}</span></div></div>`;
        } else {
            recent.innerHTML = '<p class="text-slate-500 text-center">Take your first assessment to see results.</p>';
        }
    }

    // Marketplace
    let marketFilter = 'All';
    function renderMarketplace() {
        const domains = ['All', ...new Set(dummyClasses.map(c=>c.domain))];
        const filters = document.getElementById('market-filters');
        filters.innerHTML = domains.map(d => `<button class="px-3 py-1.5 rounded-full text-xs font-medium border whitespace-nowrap transition ${d===marketFilter?'border-indigo-500 bg-indigo-500/20 text-indigo-300':'border-slate-700 text-slate-400 hover:border-indigo-400'}" data-filter="${d}">${d}</button>`).join('');
        filters.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { marketFilter = b.dataset.filter; renderMarketplace(); }));
        const filtered = marketFilter === 'All' ? dummyClasses : dummyClasses.filter(c => c.domain === marketFilter);
        document.getElementById('market-list').innerHTML = filtered.map(c => `
            <div class="glass rounded-xl p-5 glow">
                <div class="flex justify-between items-start mb-3"><span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">${c.domain}</span><span class="text-xs text-slate-500">${c.slots} slots left</span></div>
                <h4 class="font-semibold mb-1">${c.title}</h4>
                <p class="text-sm text-slate-400 mb-3">by ${c.teacher} · ${c.time}</p>
                <a href="${c.zoom}" target="_blank" rel="noopener noreferrer" class="inline-block px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium transition">Join Zoom →</a>
            </div>
        `).join('');
    }

    async function loadUserAssessments(email) {
        if (!email) return;
        try {
            const resp = await fetch(`/api/assessments?email=${encodeURIComponent(email)}`);
            if (resp.ok) {
                const res = await resp.json();
                if (res.data && res.data.length) {
                    allRecords = res.data;
                    renderHistory();
                    renderDashboard();
                }
            }
        } catch(e) {
            console.warn('Could not fetch user assessments from backend', e);
        }
    }

    // Leaderboard
    async function renderLeaderboard() {
        const lbList = document.getElementById('lb-list');
        try {
            const resp = await fetch('/api/leaderboard');
            if (resp.ok) {
                const res = await resp.json();
                if (res.data && res.data.length) {
                    lbList.innerHTML = res.data.map((u, i) => `
                        <div class="glass rounded-xl p-4 flex items-center gap-4 ${i<3?'glow':''}">
                            <span class="mono text-lg font-bold w-8 text-center ${i===0?'text-yellow-400':i===1?'text-slate-300':i===2?'text-amber-600':'text-slate-500'}">#${i+1}</span>
                            <div class="flex-1"><p class="font-semibold">${u.name}</p><p class="text-xs text-slate-400">${u.level || 'Member'} · 🔥 ${u.streak || 1} streak</p></div>
                            <span class="mono text-xl font-bold text-indigo-400">${u.score}%</span>
                        </div>
                    `).join('');
                    return;
                }
            }
        } catch (e) {
            console.warn('Leaderboard API unavailable, using fallback', e);
        }

        lbList.innerHTML = dummyLeaderboard.map((u,i) => `
            <div class="glass rounded-xl p-4 flex items-center gap-4 ${i<3?'glow':''}">
                <span class="mono text-lg font-bold w-8 text-center ${i===0?'text-yellow-400':i===1?'text-slate-300':i===2?'text-amber-600':'text-slate-500'}">#${i+1}</span>
                <div class="flex-1"><p class="font-semibold">${u.name}</p><p class="text-xs text-slate-400">${u.level} · 🔥 ${u.streak} streak</p></div>
                <span class="mono text-xl font-bold text-indigo-400">${u.score}%</span>
            </div>
        `).join('');
    }

    // Referrals
    function renderReferrals() {
        const myScore = lastResult ? lastResult.overall : (allRecords.filter(r=>r.user_email===userData.email).length ? allRecords.filter(r=>r.user_email===userData.email).slice(-1)[0].overall_score : 0);
        document.getElementById('ref-list').innerHTML = dummyReferrals.map(r => {
            const eligible = myScore >= r.minScore;
            return `
                <div class="glass rounded-xl p-5 glow ${eligible?'':'opacity-60'}">
                    <div class="flex items-center gap-3 mb-3"><span class="text-2xl">${r.logo}</span><div><p class="font-semibold">${r.company}</p><p class="text-sm text-slate-400">${r.role}</p></div></div>
                    <p class="text-xs text-slate-500 mb-2">Min Score: ${r.minScore}% · ${r.skills.join(', ')}</p>
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-medium ${eligible?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}">${eligible?'✓ Eligible':'✗ Need '+r.minScore+'%'}</span>
                </div>`;
        }).join('');
    }

    // History
    function renderHistory() {
        const list = document.getElementById('history-list');
        const empty = document.getElementById('history-empty');
        const userRecs = userData.email ? allRecords.filter(r => r.user_email === userData.email) : allRecords;
        if (!userRecs.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
        empty.classList.add('hidden');
        list.innerHTML = userRecs.slice().reverse().map(r => `
            <div class="glass rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div><p class="font-semibold">${r.user_name} <span class="text-slate-500 text-sm font-normal">${r.user_role}</span></p><p class="text-sm text-slate-400">${r.stream} · ${r.specialization} · <span class="text-indigo-300">${r.difficulty_level || 'medium'}</span></p></div>
                <div class="flex items-center gap-4"><span class="mono text-2xl font-bold text-indigo-400">${r.overall_score}%</span><span class="px-3 py-1 rounded-full text-xs font-medium ${r.predicted_level==='Expert'?'bg-emerald-500/20 text-emerald-400':r.predicted_level==='Advanced'?'bg-blue-500/20 text-blue-400':r.predicted_level==='Intermediate'?'bg-amber-500/20 text-amber-400':'bg-red-500/20 text-red-400'}">${r.predicted_level}</span><span class="text-xs text-slate-500">${new Date(r.assessment_date).toLocaleDateString('en-IN')}</span></div>
            </div>
        `).join('');
    }

    // Data SDK
    const handler = {
        onDataChanged(data) {
            allRecords = data;
            renderHistory();
            // Auto-restore user if returning
            const savedEmail = localStorage.getItem('skillswap_email');
            if (savedEmail && !userData.email) {
                const userRecs = data.filter(r => r.user_email === savedEmail);
                if (userRecs.length) {
                    const last = userRecs[userRecs.length - 1];
                    userData = { name: last.user_name, email: last.user_email, role: last.user_role, stream: last.stream, spec: last.specialization };
                }
            }
        }
    };

    // Standalone fallback for Canva dataSdk
    if (!window.dataSdk) {
        window.dataSdk = {
            async init(h) {
                const stored = localStorage.getItem('skillswap_records');
                const data = stored ? JSON.parse(stored) : [];
                if (h && h.onDataChanged) h.onDataChanged(data);
                return { isOk: true };
            },
            async create(record) {
                const stored = localStorage.getItem('skillswap_records');
                const data = stored ? JSON.parse(stored) : [];
                data.push(record);
                localStorage.setItem('skillswap_records', JSON.stringify(data));
                if (handler && handler.onDataChanged) handler.onDataChanged(data);
                return { isOk: true };
            }
        };
    }

    // Populate UI text labels if empty
    const defaultTexts = {
        'hero-badge': 'AI-Powered Skill Assessment',
        'hero-title': 'SkillSwap AI',
        'hero-subtitle': 'Adaptive assessments, real-time analytics, peer learning & job referrals tailored to your skills.',
        'hero-cta': 'Get Started',
        'form-title': 'Create Your Profile',
        'form-subtitle': 'Enter your details to generate customized assessment questions',
        'label-name': 'Full Name',
        'label-email': 'Email Address',
        'label-role': 'Role',
        'label-stream': 'Stream / Field (e.g., CS, Commerce)',
        'label-spec': 'Specialization',
        'form-submit': 'Begin Assessment',
        'assess-title': 'Skill Assessment',
        'results-title': 'Assessment Results',
        'results-subtitle': 'Here is your skill breakdown and personalized analysis',
        'score-label': 'Overall Score',
        'bar-title': 'Domain Breakdown',
        'gaps-title': 'Identified Skill Gaps',
        'recs-title': 'Recommended Next Steps',
        'goto-dashboard-btn': 'Go to Dashboard',
        'dash-title': 'Student Dashboard',
        'stat-streak-label': 'Assessments Taken',
        'stat-taught-label': 'Classes Taught',
        'stat-taken-label': 'Classes Attended',
        'stat-tscore-label': 'Teaching Rating',
        'dash-upcoming-title': 'Upcoming Live Sessions',
        'dash-recent-title': 'Recent Assessment',
        'market-title': 'Peer Learning Marketplace',
        'market-subtitle': 'Exchange skills and join peer-led live sessions',
        'lb-title': 'Top Learners Leaderboard',
        'ref-title': 'Job & Internship Referrals',
        'ref-subtitle': 'Opportunities unlocked based on your assessment scores',
        'history-title': 'Assessment History',
        'history-empty': 'No assessment records yet. Take an assessment to see results here.'
    };
    Object.entries(defaultTexts).forEach(([id, text]) => {
        const el = document.querySelector(`[data-template-id="${id}"]`);
        if (el && !el.textContent.trim()) {
            el.textContent = text;
        }
    });

    async function initApp() {
        const storedUser = localStorage.getItem('skillswap_user');
        if (storedUser) {
            try {
                userData = JSON.parse(storedUser);
                updateUserUI(userData);
                await loadUserAssessments(userData.email);
            } catch(e) {}
        } else {
            updateUserUI(null);
        }

        if (window.dataSdk && window.dataSdk.init) {
            try { await window.dataSdk.init(handler); } catch (e) {}
        }
        if (window.lucide && window.lucide.createIcons) {
            lucide.createIcons();
        }
    }
    initApp();
})();
  </script>
 </body>
